name: Research (Polymarket 5-minute history)

on:
  workflow_dispatch:
    inputs:
      recent_days:
        description: "Recent days to pull from Polymarket"
        default: "2"
      skip_history:
        description: "Skip the spring 2026 history (faster)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pyarrow
      - name: Pull history and test strategies
        run: python research/poly5m.py --recent-days ${{ inputs.recent_days }} ${{ inputs.skip_history && '--skip-history' || '' }}
      - name: Save results
        if: always()
        run: |
          git config user.name "research-bot"
          git config user.email "research-bot@users.noreply.github.com"
          git add results/poly5m/ || true
          git diff --cached --quiet && exit 0
          git commit -m "Research: Polymarket 5-minute results $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep 5; done
