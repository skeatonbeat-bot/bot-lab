name: Bot tournament (paper money)

on:
  schedule:
    - cron: "*/15 * * * *"   # backup only: GitHub often skips these for hours
  # The reliable 15-minute start comes from the connector's Cloudflare cron
  # (wrangler.toml), which calls workflow_dispatch below.
  workflow_dispatch: {}       # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: tournament
  cancel-in-progress: false

env:
  # Coinbase pairs to run. BTC first; the rest are the more volatile coins.
  COINS: "BTC-USD ETH-USD SOL-USD DOGE-USD XRP-USD"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Slow League (4-hour candles)
        run: |
          for p in $COINS; do python paper_live.py --candle 4h --product $p --once || echo "::warning::4h $p failed"; done
        continue-on-error: true
      - name: Hourly League (1-hour candles)
        run: |
          for p in $COINS; do python paper_live.py --candle 1h --product $p --once || echo "::warning::1h $p failed"; done
        continue-on-error: true
      - name: Half-Hour League (30-minute candles)
        run: |
          for p in $COINS; do python paper_live.py --candle 30min --product $p --once || echo "::warning::30min $p failed"; done
        continue-on-error: true
      - name: Speed League (15-minute candles)
        run: |
          for p in $COINS; do python paper_live.py --candle 15min --product $p --once || echo "::warning::15min $p failed"; done
        continue-on-error: true
      - name: 5-Minute League (Polymarket Up or Down bets)
        run: python poly5m_live.py || echo "::warning::5min league failed"
        continue-on-error: true
      - name: Save results
        if: always()
        run: |
          git config user.name "tournament-bot"
          git config user.email "tournament-bot@users.noreply.github.com"
          git add live/
          git diff --cached --quiet || (git commit -m "Tournament update $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
