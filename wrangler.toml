# Lets Cloudflare deploy the Edge Finder connector straight from the repo root
# with its default settings (project name "bot-lab", no root directory).
name = "bot-lab"
main = "connector/src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Start the bot tournament on GitHub every 15 minutes (GitHub's own schedule is unreliable).
[triggers]
crons = ["*/15 * * * *"]

[vars]
GITHUB_REPO = "skeatonbeat-bot/bot-lab"

# CONNECTOR_KEY and GITHUB_TOKEN are secrets: set them in the Cloudflare dashboard
# (Worker > Settings > Variables and Secrets), never in this file.
